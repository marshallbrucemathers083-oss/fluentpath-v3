<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f3ec"><title>Create an account · FluentPath</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"></head><body><a class="skip-link" href="#auth-form">Skip to form</a><main class="auth-shell"><a class="brand" href="/"><span class="brand-mark">f</span> FluentPath</a><div class="auth-card card"><div class="eyebrow">Start with the English you know</div><h1 class="serif">Create your account</h1><p class="muted">Your learning path begins with a simple step.</p><div class="notice" id="auth-notice" role="status" hidden></div><form id="auth-form" novalidate data-mode="register"><div class="field"><label for="full-name">Your name</label><input id="full-name" name="name" autocomplete="name" required minlength="2" maxlength="80"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-help"><small id="password-help" class="muted">Use at least 8 characters.</small></div><button class="button button-primary auth-submit" type="submit" id="submit-button">Create account</button><p class="status" id="auth-status" role="status" aria-live="polite"></p></form><div class="auth-links"><span>Already learning here? <a href="/login.html">Sign in</a></span></div></div><p class="auth-foot">A steady practice makes a difference.</p></main><script type="module" src="/js/auth.js"></script></body></html>
