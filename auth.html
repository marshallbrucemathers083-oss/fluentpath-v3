<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f3ec"><title>Sign in · FluentPath</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"></head>
<body><a class="skip-link" href="#auth-form">Skip to form</a><main class="auth-shell"><a class="brand" href="/"><span class="brand-mark">f</span> FluentPath</a><div class="auth-card card"><div class="eyebrow">Your next step starts here</div><h1 class="serif" id="auth-title">Welcome back</h1><p id="auth-subtitle" class="muted">Sign in to continue your learning path.</p><div class="notice" id="auth-notice" role="status" hidden></div><form id="auth-form" novalidate>
  <div class="field" id="name-field" hidden><label for="full-name">Your name</label><input id="full-name" name="name" autocomplete="name" maxlength="80"></div>
  <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
  <div class="field" id="password-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></div>
  <div class="field" id="confirm-field" hidden><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" minlength="8"></div>
  <button class="button button-primary auth-submit" type="submit" id="submit-button">Sign in</button><p class="status" id="auth-status" role="status" aria-live="polite"></p>
 </form><div class="auth-links"><a id="forgot-link" href="/forgot-password.html">Forgot your password?</a><span id="switch-copy">New to FluentPath? <a href="/register.html">Create an account</a></span></div></div><p class="auth-foot">A steady practice makes a difference.</p></main><script type="module" src="/js/auth.js"></script></body></html>
